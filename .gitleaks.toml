# ===========================================================================
#  Configuración del detector de secretos
# ===========================================================================
#  Inicia a partir del conjunto de reglas por defecto, ya reconoce claves de AWS y
#  otros proveedores, y le suma dos reglas propias para el secreto de sesión y
#  las contraseñas de base de datos escritas en el código. Deja fuera la
#  carpeta _vulnerable_baseline, que guarda a propósito el código vulnerable de
#  referencia.
# ===========================================================================
title = "FleetSec Gitleaks Config"

[extend]
useDefault = true

# --- Regla propia: secreto de sesión escrito en el código ----------------
[[rules]]
id = "fleetsec-jwt-secret"
description = "Secreto de sesión escrito en el código"
regex = '''(?i)(jwt[_-]?secret)\s*[:=]\s*['"][^'"]{8,}['"]'''
tags = ["jwt", "secret"]

# --- Regla propia: contraseña de base de datos escrita en el código ------
[[rules]]
id = "fleetsec-db-password"
description = "Contraseña de base de datos escrita en el código"
regex = '''(?i)(db[_-]?password|database[_-]?password)\s*[:=]\s*['"][^'"]{6,}['"]'''
tags = ["password", "database"]

[allowlist]
description = "Excluye los ejemplos de la documentación y los falsos positivos"
# En las rutas se aceptan las dos formas de separador para que la exclusión
# funcione igual en Windows y en Linux.
#
# La carpeta _vulnerable_baseline ya no se excluye: se dejó dentro del alcance
# a propósito para comprobar que las puertas del pipeline se disparan de verdad
# y para poder revisar cómo queda el informe consolidado cuando hay hallazgos.
# Para volver al comportamiento anterior basta con reponer la línea
# '''_vulnerable_baseline''' en esta lista.
paths = [
  '''vapt[\\/]poc''',
  '''README\.md''',
]
# Falsos positivos: nombres de reglas de control de AWS que llevan la palabra
# password pero no son secretos, sino identificadores del propio servicio.
regexes = [
  '''IAM_PASSWORD_POLICY''',
  '''iam-password-policy''',
]
